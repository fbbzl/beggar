# Minimum highly available Loki compute plane. Object data is stored in the
# MinIO/S3 service named `minio` in the same namespace.

deploymentMode: SimpleScalable

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 3
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
      admin: loki-admin
    s3:
      endpoint: http://minio:9000
      region: us-east-1
      accessKeyId: minioadmin
      secretAccessKey: minioadmin
      s3ForcePathStyle: true
      insecure: true

gateway:
  enabled: true
  replicas: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

write:
  replicas: 3
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  persistence:
    volumeClaimsEnabled: true
    size: 10Gi

read:
  replicas: 3
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

backend:
  replicas: 3
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  persistence:
    volumeClaimsEnabled: true
    size: 10Gi

singleBinary:
  replicas: 0

# Keep the minimum profile small and remove cache single points of failure.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

minio:
  enabled: false

test:
  enabled: false
