# Two clustered Alloy collectors use the Kubernetes API to collect Pod logs.
# Clustering shards targets between replicas and avoids duplicate ingestion.

alloy:
  clustering:
    enabled: true
  configMap:
    content: |-
      logging {
        level  = "info"
        format = "logfmt"
      }

      discovery.kubernetes "pods" {
        role = "pod"
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.kubernetes.pods.targets
        forward_to = [loki.write.loki.receiver]

        clustering {
          enabled = true
        }
      }

      loki.write "loki" {
        endpoint {
          url = "http://loki-gateway/loki/api/v1/push"
        }
      }

controller:
  type: deployment
  replicas: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
              app.kubernetes.io/instance: alloy
          topologyKey: kubernetes.io/hostname

serviceMonitor:
  enabled: false
