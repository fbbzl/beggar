# Independent etcd cluster. This is intentionally separate from the etcd
# bundled with APISIX so gateway changes cannot affect platform coordination.

replicaCount: 3

auth:
  rbac:
    create: true
    allowNoneAuthentication: false
    # Development default used by the rest of this repository. Replace it for
    # any shared or production-like cluster.
    rootPassword: "etcdroot123"

persistence:
  enabled: true
  size: 8Gi

pdb:
  create: true
  minAvailable: 2

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: etcd
            app.kubernetes.io/instance: etcd
        topologyKey: kubernetes.io/hostname

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
